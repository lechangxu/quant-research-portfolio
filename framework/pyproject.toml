[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantgate"
version = "0.1.0"
description = "Portfolio-level out-of-sample A/B acceptance gate for systematic factors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["quantgate*"]
